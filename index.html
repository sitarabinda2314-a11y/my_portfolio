<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9eef6;
    --ink: #17233b;
    --muted: #5d6b85;
    --card: #ffffff;
    --line: #c9d3e3;
    --accent: #3451d1;
    --accent-ink: #ffffff;
    --error: #b42318;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Sora", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: grid;
    place-items: center;
    padding: 20px;
  }
  main {
    width: 100%;
    max-width: 860px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--card);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(23, 35, 59, .12);
  }
  .intro {
    background: var(--ink);
    color: #fff;
    padding: 48px 36px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .intro h1 { font-size: 2.2rem; line-height: 1.15; margin: 0 0 14px; }
  .intro p { margin: 0; color: #b8c4dd; line-height: 1.6; font-size: .95rem; }
  .panel { padding: 48px 36px; }
  h2 { margin: 0 0 6px; font-size: 1.4rem; }
  .sub { margin: 0 0 26px; color: var(--muted); font-size: .9rem; }
  label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 6px; }
  .field { margin-bottom: 18px; }
  input {
    width: 100%;
    font: inherit;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    color: var(--ink);
    background: #fff;
  }
  input:focus-visible, button:focus-visible, a:focus-visible {
    outline: 3px solid rgba(52, 81, 209, .4);
    outline-offset: 2px;
  }
  .pw { position: relative; }
  .pw input { padding-right: 70px; }
  .toggle {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: 0; color: var(--accent);
    font: inherit; font-size: .8rem; font-weight: 600; cursor: pointer; padding: 6px;
  }
  .btn {
    display: block; width: 100%; text-align: center; text-decoration: none;
    font: inherit; font-weight: 600; padding: 13px;
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 10px; cursor: pointer;
  }
  .btn:hover { background: #2a42b0; }
  .error { color: var(--error); font-size: .85rem; min-height: 1.2em; margin: 0 0 14px; }
  #welcome { display: none; }
  @media (max-width: 700px) {
    main { grid-template-columns: 1fr; }
    .intro { padding: 32px 28px; }
    .intro h1 { font-size: 1.7rem; }
    .panel { padding: 32px 28px; }
  }
</style>
</head>
<body>
<main>
  <section class="intro">
    <h1>Mere portfolio mein aapka swagat hai</h1>
    <p>Aage badhne ke liye login karein.</p>
  </section>

  <section class="panel">
    <div id="login">
      <h2>Login</h2>
      <p class="sub">Aage badhne ke liye password daalein.</p>
      <form id="form" novalidate>
        <div class="field">
          <label for="pass">Password</label>
          <div class="pw">
            <input id="pass" type="password" autocomplete="current-password" required>
            <button type="button" class="toggle" id="toggle">Dikhao</button>
          </div>
        </div>
        <p class="error" id="error" role="alert"></p>
        <button type="submit" class="btn">Login karo</button>
      </form>
    </div>

    <div id="welcome">
      <h2>Login ho gaya</h2>
      <p class="sub">Ab aap main page par ja sakte hain.</p>
      <a class="btn" id="mainLink" href="main.html">Main page kholo</a>
    </div>
  </section>
</main>

<script>
  // ====== YAHAN APNI SETTINGS BADLO ======
  var PASSWORD  = "1122";
  var MAIN_PAGE = "main.html";   // aapke main page ki file ka naam
  // =======================================

  var form = document.getElementById("form");
  var error = document.getElementById("error");
  var pass = document.getElementById("pass");

  document.getElementById("mainLink").href = MAIN_PAGE;

  function showWelcome() {
    document.getElementById("login").style.display = "none";
    document.getElementById("welcome").style.display = "block";
  }

  try {
    if (sessionStorage.getItem("loggedIn") === "yes") showWelcome();
  } catch (e) {}

  document.getElementById("toggle").addEventListener("click", function () {
    var hidden = pass.type === "password";
    pass.type = hidden ? "text" : "password";
    this.textContent = hidden ? "Chhupao" : "Dikhao";
  });

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (pass.value === PASSWORD) {
      try { sessionStorage.setItem("loggedIn", "yes"); } catch (e) {}
      error.textContent = "";
      showWelcome();
    } else {
      error.textContent = "Password galat hai. Dobara try karein.";
      pass.value = "";
      pass.focus();
    }
  });
</script>
</body>
</html>
